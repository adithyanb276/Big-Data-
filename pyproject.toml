[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streampulse"
version = "0.1.0"
description = "Local-first video telemetry analytics and personalization capstone"
requires-python = ">=3.11,<3.13"
dependencies = [
  "boto3==1.36.26",
  "duckdb==1.2.2",
  "pandas==2.2.3",
  "plotly==6.0.0",
  "pyarrow==19.0.1",
  "pyspark==3.5.5",
  "python-dotenv==1.0.1",
  "streamlit==1.42.2",
]

[project.scripts]
streampulse = "streampulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"